# Explicit isolated test services: no connection to the development parking DB.
services:
  test-db:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    profiles: [phase34]
    environment:
      POSTGRES_DB: parking_test
      POSTGRES_USER: parking_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure .env}
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - retained_test_data:/var/lib/postgresql/data
      - ./database:/workspace/database:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking_test -d parking_test"]
      interval: 2s
      retries: 30
  test-api:
    image: vehicle-parking-system-api:latest
    profiles: [phase34]
    environment:
      API_DATABASE_URL: host=test-db port=5432 dbname=parking_test user=parking_test password=${POSTGRES_PASSWORD} connect_timeout=3
      API_LISTEN_HOST: 0.0.0.0
      OPS_METRICS_TOKEN: ${OPS_METRICS_TOKEN:-}
      OIDC_INTERNAL_URL: http://identity:8080
      OIDC_REALM: ${PARKING_TEST_REALM:?Use py scripts/test_phase34.py}
      OIDC_ISSUER: http://127.0.0.1:8180/realms/${PARKING_TEST_REALM}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_DRIVER_ADMIN_SECRET: ${OIDC_DRIVER_ADMIN_SECRET:-}
      REQUIRE_STAFF_MFA: ${PARKING_TEST_REQUIRE_MFA:-true}
      APP_ORIGIN: http://127.0.0.1:5173
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      test-db:
        condition: service_healthy
  test-api-peer:
    image: vehicle-parking-system-api:latest
    profiles: [phase34]
    environment:
      API_DATABASE_URL: host=test-db port=5432 dbname=parking_test user=parking_test password=${POSTGRES_PASSWORD} connect_timeout=3
      API_LISTEN_HOST: 0.0.0.0
      OPS_METRICS_TOKEN: ${OPS_METRICS_TOKEN:-}
      OIDC_INTERNAL_URL: http://identity:8080
      OIDC_REALM: ${PARKING_TEST_REALM:?Use py scripts/test_phase34.py}
      OIDC_ISSUER: http://127.0.0.1:8180/realms/${PARKING_TEST_REALM}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_DRIVER_ADMIN_SECRET: ${OIDC_DRIVER_ADMIN_SECRET:-}
      REQUIRE_STAFF_MFA: ${PARKING_TEST_REQUIRE_MFA:-true}
      APP_ORIGIN: http://127.0.0.1:5173
    ports: ["127.0.0.1:18081:8080"]
    depends_on:
      test-db:
        condition: service_healthy
volumes:
  retained_test_data:
