# Example for a private monitoring network; never publish port 8080 or metrics.
scrape_configs:
  - job_name: parking-api
    scrape_interval: 15s
    metrics_path: /internal/metrics
    static_configs:
      - targets: [api:8080]
    authorization:
      type: Bearer
      credentials_file: /run/secrets/parking-metrics-token
rule_files: [parking-alerts.yml]
