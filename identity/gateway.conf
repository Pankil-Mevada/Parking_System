limit_req_zone $binary_remote_addr zone=identity_login:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=identity_recovery:10m rate=5r/m;
server {
    listen 8080;
    server_name _;
    # OIDC action URLs contain credentials. Never log request URLs here.
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 64k;
    limit_req_status 429;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    location ~ /login-actions/reset-credentials {
        limit_req zone=identity_recovery burst=5 nodelay;
        proxy_pass http://identity:8080;
    }
    location ~ /(login-actions/(authenticate|registration)|protocol/openid-connect/(auth|token)) {
        limit_req zone=identity_login burst=80 nodelay;
        proxy_pass http://identity:8080;
    }
    location / {
        proxy_pass http://identity:8080;
    }
}
