services:
  restore-db:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    profiles: [operations]
    environment:
      POSTGRES_USER: parking_restore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes: [restore_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U parking_restore -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  restore_data:
