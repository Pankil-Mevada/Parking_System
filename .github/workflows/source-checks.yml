name: Parking source checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python scripts/scan_secrets.py
      - run: python -m unittest discover -s tests -p test_secret_scan.py -v
      - run: python -m unittest discover -s tests -p test_recovery.py -v
      - run: python -m unittest discover -s tests -p test_device_simulator.py -v
      - run: python -m compileall -q scripts tests
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
