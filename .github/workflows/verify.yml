name: Parking verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    # Dedicated persistent runner keeps committed test data as requested.
    # Never attach this label to an operator's production machine.
    runs-on: [self-hosted, linux, parking-ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: npm install --global pnpm@11.25.0
      - run: python scripts/ci_verify.py
